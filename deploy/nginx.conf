server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* "^/join/([a-f0-9]{8})/?$" {
        return 302 /invite.html?room=$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
